services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-change-me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chamly}
      MYSQL_USER: ${MYSQL_USER:-chamly}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-app-change-me}
    ports:
      - '127.0.0.1:${DB_PORT:-45101}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chamly}
      MYSQL_USER: ${MYSQL_USER:-chamly}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-app-change-me}
      API_PORT: 45100
      ADMIN_USERNAME: ${ADMIN_USERNAME:-adminserverday}
      ADMIN_ROOM_NAME: ${ADMIN_ROOM_NAME:-adminserverday}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:45102,http://localhost:45103}
    ports:
      - '${API_PORT:-45100}:45100'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:45100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql_data:
