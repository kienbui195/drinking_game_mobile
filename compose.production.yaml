name: chamly-production
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chamly}
      MYSQL_USER: ${MYSQL_USER:-chamly}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e "SELECT 1"',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    logging:
      options: { max-size: '10m', max-file: '3' }
  api:
    image: chamly-api:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      API_PORT: 45100
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chamly}
      MYSQL_USER: ${MYSQL_USER:-chamly}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      CORS_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN}
      ADMIN_ROOM_NAME: ${ADMIN_ROOM_NAME:-adminserverday}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:45100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      options: { max-size: '10m', max-file: '3' }
  web:
    image: chamly-web:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: https://${API_DOMAIN:?Set API_DOMAIN}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports: ['127.0.0.1:${WEB_PORT:-45104}:80']
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    logging:
      options: { max-size: '10m', max-file: '3' }
volumes:
  mysql_data:
  caddy_data:
  caddy_config:
